<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎵 Music Lyrics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0a0a0f; --card:#1a1a24;
    --text:#f0f0f5; --text-dim:#8a8a99; --text-dimmer:#55555f;
    --highlight-bg:#3a3a4e; --highlight-border:#6a6a8e;
    --accent:#00e5ff; --ok:#4ade80; --warn:#ffb800;
  }
  html, body {
    width:100%; min-height:100vh;
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
    overflow-x:hidden; touch-action:pan-y;
    -webkit-font-smoothing:antialiased;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse at top, rgba(80,60,130,0.22), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(130,50,90,0.14), transparent 60%);
    z-index:-1;
  }
  .app { max-width:640px; margin:0 auto; padding:16px 14px 40px; min-height:100vh; }

  .search-wrap {
    display:flex; align-items:center; gap:10px;
    margin-bottom:20px; padding:4px 0;
    position:sticky; top:8px; z-index:100;
  }
  .back-btn {
    width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
    color:var(--text); font-size:1.2rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; transition:.2s;
  }
  .back-btn:hover { background:rgba(255,255,255,0.12); }
  .search-bar {
    flex:1; display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
    border-radius:24px; padding:6px 6px 6px 16px;
    transition:.2s; backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }
  .search-bar:focus-within {
    border-color:rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.09);
    box-shadow:0 0 0 4px rgba(255,255,255,0.04);
  }
  .search-bar svg { width:18px; height:18px; opacity:0.5; flex-shrink:0; }
  .search-bar input {
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-size:0.9rem; font-family:inherit;
    min-width:0; user-select:text; -webkit-user-select:text;
    padding:6px 0;
  }
  .search-bar input::placeholder { color:var(--text-dimmer); }
  .search-btn {
    padding:9px 18px; border-radius:18px; border:none;
    background:linear-gradient(135deg,#ffffff,#d8d8e0); color:#0a0a0f;
    font-size:0.82rem; font-weight:700; cursor:pointer;
    font-family:inherit; transition:.15s; flex-shrink:0;
  }
  .search-btn:active { transform:scale(0.96); }

  .center-state {
    text-align:center; padding:50px 20px;
    color:var(--text-dimmer); font-size:0.9rem;
  }
  .center-state .big-icon {
    font-size:3.5rem; display:block; margin-bottom:18px; opacity:0.5;
  }
  .center-state .title {
    font-size:1.05rem; color:var(--text-dim); font-weight:600;
    margin-bottom:10px;
  }
  .center-state .sub { font-size:0.82rem; opacity:0.75; line-height:1.7; }

  .help-card {
    background:rgba(255,184,0,0.08);
    border:1px solid rgba(255,184,0,0.25);
    border-radius:14px; padding:16px; margin-top:20px;
    text-align:left; font-size:0.82rem; line-height:1.7;
    color:rgba(255,255,255,0.85);
  }
  .help-card h4 {
    color:#ffb800; font-size:0.85rem; margin-bottom:10px;
    font-weight:700; letter-spacing:0.3px;
  }
  .help-card ol { padding-left:18px; }
  .help-card ol li { margin-bottom:6px; }
  .help-card code {
    background:rgba(0,0,0,0.4); padding:2px 6px;
    border-radius:4px; font-size:0.75rem;
    color:#00e5ff; user-select:text; -webkit-user-select:text;
  }
  .help-card .badge {
    display:inline-block; padding:2px 8px; border-radius:8px;
    background:rgba(0,229,255,0.15); color:#00e5ff;
    font-size:0.7rem; font-weight:700;
    margin-right:6px; letter-spacing:0.5px;
  }

  .spinner {
    display:inline-block; width:32px; height:32px;
    border:3px solid rgba(255,255,255,0.1);
    border-top-color:#fff; border-radius:50%;
    animation:spin 0.8s linear infinite; margin-bottom:14px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .result-item {
    display:flex; align-items:center; gap:12px;
    padding:10px; border-radius:14px;
    background:transparent; cursor:pointer;
    transition:.15s; margin-bottom:4px;
    animation:fadeUp .3s ease both;
  }
  .result-item:hover, .result-item:active {
    background:rgba(255,255,255,0.06);
  }
  .result-art {
    width:56px; height:56px; border-radius:10px;
    object-fit:cover; background:#222; flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
  }
  .result-info { flex:1; min-width:0; }
  .result-title {
    font-size:0.92rem; font-weight:600; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:3px;
  }
  .result-artist {
    font-size:0.78rem; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .result-play {
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
    font-size:0.7rem; color:var(--text-dim);
    flex-shrink:0;
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }

  #playerView { animation:fadeUp .4s ease; }
  .album-wrap {
    width:100%; display:flex; justify-content:center;
    margin-bottom:20px; padding-top:8px;
  }
  .album-art {
    width:200px; height:200px; border-radius:18px;
    object-fit:cover; background:#1a1a24;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.06);
    transition:transform .3s;
  }
  .album-art.playing { animation:pulseArt 3s ease-in-out infinite; }
  @keyframes pulseArt {
    0%,100% { transform:scale(1); }
    50%     { transform:scale(1.02); }
  }

  .song-info { text-align:center; margin-bottom:18px; padding:0 8px; }
  .song-title-lg {
    font-size:1.15rem; font-weight:700; margin-bottom:5px;
    color:var(--text); line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .song-artist-lg { font-size:0.85rem; color:var(--text-dim); }

  audio {
    width:100%; border-radius:12px; margin-bottom:20px;
    filter:invert(0.92) hue-rotate(180deg) saturate(1.2) brightness(1.1);
    height:40px;
  }

  .lyrics-header {
    display:flex; align-items:center; justify-content:space-between;
    font-size:0.7rem; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:1.2px; font-weight:600;
    padding:0 4px; margin-bottom:12px;
  }
  .lyrics-badge {
    padding:4px 10px; border-radius:12px;
    background:rgba(255,255,255,0.06);
    font-size:0.62rem; letter-spacing:0.8px;
    color:var(--text-dim);
  }
  .lyrics-badge.ok { background:rgba(74,222,128,0.12); color:var(--ok); }
  .lyrics-badge.warn { background:rgba(255,184,0,0.12); color:var(--warn); }

  #lyricsDisplay {
    max-height:55vh; overflow-y:auto;
    padding:16px 4px 100px;
    scroll-behavior:smooth; scrollbar-width:none;
    position:relative;
    mask-image:linear-gradient(180deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
  }
  #lyricsDisplay::-webkit-scrollbar { display:none; }

  .lyric-line {
    font-size:clamp(1.05rem, 3.3vw, 1.25rem);
    font-weight:400; line-height:1.6;
    color:var(--text-dimmer); padding:8px 4px;
    margin:2px 0; transition:color .4s ease, opacity .4s ease;
    cursor:pointer; text-align:center;
  }
  .lyric-line:hover { color:var(--text-dim); }
  .lyric-line.upcoming { color:var(--text-dimmer); opacity:0.6; }
  .lyric-line.passed   { color:var(--text-dimmer); opacity:0.45; }
  .lyric-line.active {
    color:var(--text); opacity:1; font-weight:600;
    font-size:clamp(1.15rem, 3.7vw, 1.4rem);
  }

  .word {
    display:inline-block; padding:3px 5px; margin:0 -2px;
    border-radius:6px; transition:all .18s cubic-bezier(0.4,0,0.2,1);
  }
  .word.active {
    background:var(--highlight-bg); color:#fff; font-weight:700;
    box-shadow:0 0 0 1px var(--highlight-border),
               0 0 24px rgba(150,150,200,0.3);
    transform:scale(1.05);
  }
  .word.passed { color:#c8c8d8; }

  .toast {
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:rgba(30,30,45,0.96);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    padding:11px 20px; border-radius:30px;
    font-size:0.8rem; font-weight:500; color:var(--text);
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    opacity:0; transition:all .35s cubic-bezier(0.4,0,0.2,1);
    z-index:1000; pointer-events:none;
    max-width:90vw; text-align:center;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:480px) {
    .album-art { width:170px; height:170px; border-radius:16px; }
    .song-title-lg { font-size:1.05rem; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="search-wrap">
    <button class="back-btn" id="backBtn" style="display:none" onclick="backToSearch()">←</button>
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="M20 20l-3.5-3.5"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Cari lagu atau artis..." autocomplete="off">
      <button class="search-btn" id="searchBtn">Cari</button>
    </div>
  </div>

  <div id="resultsView">
    <div class="center-state">
      <span class="big-icon">🎵</span>
      <div class="title">Cari lagu favoritmu</div>
      <div class="sub">Ketik judul lagu atau nama artis di atas<br>lalu tekan <b>Cari</b> ✨</div>
    </div>
  </div>

  <div id="playerView" style="display:none">
    <div class="album-wrap">
      <img id="albumArt" class="album-art" src="" alt="" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iIzFhMWEyNCIvPjx0ZXh0IHg9IjEwMCIgeT0iMTEwIiBmb250LXNpemU9IjYwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNTU1NTVmIj7imYvvuI88L3RleHQ+PC9zdmc+'">
    </div>
    <div class="song-info">
      <div class="song-title-lg" id="playerTitle">—</div>
      <div class="song-artist-lg" id="playerArtist">—</div>
    </div>
    <audio id="audioPlayer" controls preload="auto"></audio>

    <div class="lyrics-header">
      <span>Lirik</span>
      <span class="lyrics-badge" id="lyricsBadge">Menunggu...</span>
    </div>

    <div id="lyricsDisplay">
      <div class="center-state" style="padding:40px 20px">
        <div class="spinner"></div>
        <div class="sub">Mencari lirik...</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================
   🔒 ANTI-ZOOM
   ========================================== */
document.addEventListener('wheel', function(e){ if(e.ctrlKey) e.preventDefault(); }, {passive:false});
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && ['+','-','=','0'].indexOf(e.key) !== -1) e.preventDefault();
});
['gesturestart','gesturechange','gestureend'].forEach(function(evt){
  document.addEventListener(evt, function(e){ e.preventDefault(); });
});
var _lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if(now - _lastTouchEnd <= 300) e.preventDefault();
  _lastTouchEnd = now;
}, {passive:false});
document.addEventListener('touchmove', function(e){
  if(e.touches.length > 1) e.preventDefault();
}, {passive:false});


/* ==========================================
   🚨 DETEKSI ENVIRONMENT
   ========================================== */
function isLimitedWebView() {
  // Deteksi ZArchiver, File Manager, dll yang bukan browser asli
  var ua = navigator.userAgent || '';
  var isZArch = ua.indexOf('ZArchiver') !== -1;
  var isFile = location.protocol === 'file:';
  var isContent = location.protocol === 'content:';
  var isRealChrome = /Chrome\/\d+/.test(ua) && !/wv\)/.test(ua); // bukan WebView
  return {
    isZArchiver: isZArch,
    isFileProtocol: isFile,
    isContentProtocol: isContent,
    isRealChrome: isRealChrome,
    likelyBlocked: (isFile || isContent) && !isRealChrome
  };
}


/* ==========================================
   🎯 ELEMEN
   ========================================== */
var searchInput = document.getElementById('searchInput');
var searchBtn = document.getElementById('searchBtn');
var backBtn = document.getElementById('backBtn');
var resultsView = document.getElementById('resultsView');
var playerView = document.getElementById('playerView');
var albumArt = document.getElementById('albumArt');
var playerTitle = document.getElementById('playerTitle');
var playerArtist = document.getElementById('playerArtist');
var audioPlayer = document.getElementById('audioPlayer');
var lyricsDisplay = document.getElementById('lyricsDisplay');
var lyricsBadge = document.getElementById('lyricsBadge');
var toast = document.getElementById('toast');


/* ==========================================
   💬 TOAST
   ========================================== */
var toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
}


/* ==========================================
   🛠 RENDER ERROR DENGAN PANDUAN
   ========================================== */
function renderNetworkError(reason) {
  var env = isLimitedWebView();
  var html = '<div class="center-state">' +
    '<span class="big-icon">📡</span>' +
    '<div class="title">Tidak bisa akses internet</div>' +
    '<div class="sub">' + (reason || 'Aplikasi ini butuh akses ke iTunes & LRCLIB') + '</div>';

  if (env.likelyBlocked) {
    html +=
      '<div class="help-card">' +
        '<h4>🚨 Kamu buka di WebView yang terbatas</h4>' +
        'Browser yang kamu pakai (kemungkinan dari file manager / ZArchiver) tidak bisa akses internet. ' +
        'Coba salah satu cara berikut:' +
        '<ol>' +
          '<li><span class="badge">CARA 1</span>Pindahkan file <code>index.html</code> ke folder <b>Download</b>, lalu buka pakai <b>Chrome</b> dengan alamat:<br><code>file:///sdcard/Download/index.html</code></li>' +
          '<li><span class="badge">CARA 2</span>Upload ke <b>Netlify Drop</b> (gratis):<br><code>app.netlify.com/drop</code> → drag file → dapat URL</li>' +
          '<li><span class="badge">CARA 3</span>Copy paste kode ke <b>CodePen</b> atau <b>JSFiddle</b>, lalu jalankan dari sana</li>' +
        '</ol>' +
      '</div>';
  } else {
    html +=
      '<div class="help-card">' +
        '<h4>⚠️ Kemungkinan penyebab:</h4>' +
        '<ol>' +
          '<li>Koneksi internet mati / lemah</li>' +
          '<li>DNS diblokir → coba ganti ke WiFi atau data seluler</li>' +
          '<li>Iklan blocker memblokir <code>itunes.apple.com</code> atau <code>lrclib.net</code></li>' +
          '<li>Coba refresh halaman (tarik ke bawah)</li>' +
        '</ol>' +
      '</div>';
  }

  html += '</div>';
  resultsView.innerHTML = html;
}

function renderSearchEmpty() {
  resultsView.innerHTML =
    '<div class="center-state">' +
      '<span class="big-icon">🔍</span>' +
      '<div class="title">Tidak ada hasil</div>' +
      '<div class="sub">Coba kata kunci lain<br>Contoh: <b>Teh Hijau</b>, <b>Sheila On 7</b>, <b>Tulus</b></div>' +
    '</div>';
}


/* ==========================================
   🔍 SEARCH — MULTI-FALLBACK
   ========================================== */
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var timer = setTimeout(function(){
      reject(new Error('timeout'));
    }, ms || 8000);
    fetch(url)
      .then(function(res){
        clearTimeout(timer);
        resolve(res);
      })
      .catch(function(err){
        clearTimeout(timer);
        reject(err);
      });
  });
}

async function searchSongs(query) {
  var url = 'https://itunes.apple.com/search?term=' +
            encodeURIComponent(query) +
            '&media=music&limit=25&entity=song';
  var res = await fetchWithTimeout(url, 10000);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  var data = await res.json();
  return data.results || [];
}

function renderSearchLoading() {
  resultsView.innerHTML =
    '<div class="center-state">' +
      '<div class="spinner"></div>' +
      '<div class="title">Mencari...</div>' +
      '<div class="sub">Menghubungi iTunes</div>' +
    '</div>';
}

function renderResults(list) {
  if (!list.length) { renderSearchEmpty(); return; }

  var html = '';
  var hasAny = false;
  for (var i = 0; i < list.length; i++) {
    var t = list[i];
    if (!t.previewUrl) continue;
    hasAny = true;
    var art = t.artworkUrl100 || t.artworkUrl60 || '';
    html +=
      '<div class="result-item" data-idx="' + i + '">' +
        '<img class="result-art" src="' + escapeHtml(art) + '" alt="" ' +
          'onerror="this.style.background=\'#222\'">' +
        '<div class="result-info">' +
          '<div class="result-title">' + escapeHtml(t.trackName || 'Unknown') + '</div>' +
          '<div class="result-artist">' + escapeHtml(t.artistName || '') + '</div>' +
        '</div>' +
        '<div class="result-play">▶</div>' +
      '</div>';
  }

  if (!hasAny) { renderSearchEmpty(); return; }
  resultsView.innerHTML = html;

  resultsView.querySelectorAll('.result-item').forEach(function(el){
    el.onclick = function(){
      var idx = parseInt(el.dataset.idx, 10);
      selectTrack(list[idx]);
    };
  });
}

async function doSearch() {
  var q = searchInput.value.trim();
  if (!q) { showToast('⚠️ Ketik judul lagu dulu'); return; }
  renderSearchLoading();

  try {
    var results = await searchSongs(q);
    renderResults(results);
  } catch(e) {
    console.warn('Search error:', e);
    var msg = 'Periksa koneksi internet kamu lalu coba lagi';
    if (e.message && e.message.indexOf('timeout') !== -1) {
      msg = 'Koneksi terlalu lambat / diblokir. Coba lagi.';
    }
    renderNetworkError(msg);
  }
}

searchBtn.onclick = doSearch;
searchInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
});


/* ==========================================
   🎵 SELECT TRACK
   ========================================== */
var currentTrack = null;
var lineTimings = [];
var currentActiveLine = -1;
var followRafId = null;

async function selectTrack(track) {
  currentTrack = track;

  resultsView.style.display = 'none';
  playerView.style.display = 'block';
  backBtn.style.display = 'flex';

  var bigArt = (track.artworkUrl100 || track.artworkUrl60 || '')
    .replace('100x100', '600x600').replace('60x60', '600x600');
  albumArt.src = bigArt;
  playerTitle.textContent = track.trackName || 'Unknown';
  playerArtist.textContent = track.artistName || '';

  audioPlayer.src = track.previewUrl;
  audioPlayer.currentTime = 0;

  lyricsDisplay.innerHTML =
    '<div class="center-state" style="padding:40px 20px">' +
      '<div class="spinner"></div>' +
      '<div class="sub">Mencari lirik...</div>' +
    '</div>';
  lyricsBadge.textContent = 'Mencari...';
  lyricsBadge.className = 'lyrics-badge';

  var lyricsResult = null;
  try {
    lyricsResult = await fetchLyrics(track.artistName, track.trackName);
  } catch(e) {
    console.warn('Lyrics error:', e);
  }

  if (lyricsResult) {
    renderLyricsWithTiming(lyricsResult);
    if (lyricsResult.type === 'synced') {
      lyricsBadge.textContent = '✨ Synced';
      lyricsBadge.className = 'lyrics-badge ok';
    } else {
      lyricsBadge.textContent = '📄 Plain';
      lyricsBadge.className = 'lyrics-badge';
    }
  } else {
    lyricsBadge.textContent = '😔 Tidak ada';
    lyricsBadge.className = 'lyrics-badge warn';
    lyricsDisplay.innerHTML =
      '<div class="center-state" style="padding:40px 20px">' +
        '<span class="big-icon" style="font-size:2rem">📭</span>' +
        '<div class="sub">Lirik tidak ditemukan untuk lagu ini</div>' +
      '</div>';
  }

  try {
    await audioPlayer.play();
    albumArt.classList.add('playing');
  } catch(e) {
    showToast('▶ Tekan play untuk memulai');
  }

  startFollowLyrics();
}


/* ==========================================
   📖 FETCH LYRICS
   ========================================== */
async function fetchLyrics(artist, track) {
  // Endpoint 1: /api/get
  try {
    var url = 'https://lrclib.net/api/get?' +
      'artist_name=' + encodeURIComponent(artist || '') +
      '&track_name=' + encodeURIComponent(track || '');
    var res = await fetchWithTimeout(url, 8000);
    if (res.ok) {
      var data = await res.json();
      if (data) {
        if (data.syncedLyrics) return { type: 'synced', text: data.syncedLyrics };
        if (data.plainLyrics)  return { type: 'plain',  text: data.plainLyrics };
      }
    }
  } catch(e) {}

  // Endpoint 2: /api/search
  try {
    var q = (artist || '') + ' ' + (track || '');
    var sr = await fetchWithTimeout('https://lrclib.net/api/search?q=' + encodeURIComponent(q), 8000);
    if (!sr.ok) return null;
    var list = await sr.json();
    if (!list || !list.length) return null;

    for (var i = 0; i < list.length; i++) {
      if (list[i].syncedLyrics) return { type: 'synced', text: list[i].syncedLyrics };
    }
    for (var j = 0; j < list.length; j++) {
      if (list[j].plainLyrics) return { type: 'plain', text: list[j].plainLyrics };
    }
    return null;
  } catch(e) {
    return null;
  }
}


/* ==========================================
   🎬 RENDER LYRICS
   ========================================== */
function parseLRCTimings(lrcText) {
  var lines = lrcText.split('\n');
  var result = [];
  var re = /^\[(\d+):(\d+)(?:[.:](\d+))?\](.*)$/;
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].trim();
    if (!t) continue;
    var m = t.match(re);
    if (m) {
      var min = parseInt(m[1], 10);
      var sec = parseInt(m[2], 10);
      var cs = m[3] ? parseInt(m[3].padEnd(2, '0').slice(0, 2), 10) : 0;
      var time = min * 60 + sec + cs / 100;
      var text = (m[4] || '').trim();
      if (text) result.push({ text: text, time: time });
    }
  }
  return result;
}

function renderLyricsWithTiming(result) {
  currentActiveLine = -1;
  lineTimings = [];

  if (result.type === 'synced') {
    var parsed = parseLRCTimings(result.text);
    if (!parsed.length) { renderPlainLyrics(result.text); return; }
    for (var i = 0; i < parsed.length; i++) {
      var endT = (i < parsed.length - 1) ? parsed[i+1].time : parsed[i].time + 5;
      lineTimings.push({ text: parsed[i].text, time: parsed[i].time, endTime: endT });
    }
    renderLines(lineTimings);
  } else {
    renderPlainLyrics(result.text);
  }
}

function renderPlainLyrics(text) {
  var rawLines = text.split('\n')
    .map(function(l){ return l.trim(); })
    .filter(function(l){ return l !== ''; });
  lineTimings = rawLines.map(function(lineText, i){
    return { text: lineText, time: i * 2.6, endTime: (i + 1) * 2.6 };
  });
  renderLines(lineTimings);
}

function renderLines(timings) {
  var html = '';
  for (var i = 0; i < timings.length; i++) {
    var words = timings[i].text.split(/\s+/).filter(Boolean);
    var wordSpans = '';
    for (var w = 0; w < words.length; w++) {
      wordSpans += '<span class="word">' + escapeHtml(words[w]) + '</span>';
      if (w < words.length - 1) wordSpans += ' ';
    }
    html += '<div class="lyric-line upcoming" data-idx="' + i + '">' +
              wordSpans +
            '</div>';
  }
  lyricsDisplay.innerHTML = html;

  lyricsDisplay.querySelectorAll('.lyric-line').forEach(function(el){
    el.onclick = function(){
      var idx = parseInt(el.dataset.idx, 10);
      currentActiveLine = idx - 1;
      setActiveLine(idx);
      if (audioPlayer.paused) audioPlayer.play();
    };
  });
}


/* ==========================================
   🔁 AUTO-FOLLOW
   ========================================== */
function startFollowLyrics() {
  stopFollowLyrics();
  if (!lineTimings.length) return;

  var previewDur = 30;
  var totalLines = lineTimings.length;

  function updatePreviewDur() {
    if (audioPlayer.duration && audioPlayer.duration > 5) {
      previewDur = audioPlayer.duration;
    }
  }
  updatePreviewDur();
  audioPlayer.addEventListener('loadedmetadata', updatePreviewDur, { once: true });

  var lineStartTime = [];
  for (var i = 0; i < totalLines; i++) {
    lineStartTime.push((i / totalLines) * previewDur);
  }

  function loop() {
    if (!audioPlayer.src) return;
    var t = audioPlayer.currentTime;
    var activeIdx = -1;
    for (var i = 0; i < lineStartTime.length; i++) {
      if (lineStartTime[i] <= t) activeIdx = i;
      else break;
    }

    if (activeIdx !== currentActiveLine) {
      currentActiveLine = activeIdx;
      setActiveLine(activeIdx);
      if (activeIdx >= 0) scrollToLine(activeIdx);
    }

    if (activeIdx >= 0) {
      var lineStart = lineStartTime[activeIdx];
      var lineEnd = (activeIdx + 1 < lineStartTime.length) ? lineStartTime[activeIdx + 1] : previewDur;
      var dur = Math.max(0.3, lineEnd - lineStart);
      var prog = Math.max(0, Math.min(1, (t - lineStart) / dur));
      updateWordProgress(activeIdx, prog);
    }

    followRafId = requestAnimationFrame(loop);
  }
  loop();
}

function stopFollowLyrics() {
  if (followRafId) { cancelAnimationFrame(followRafId); followRafId = null; }
}

function setActiveLine(idx) {
  var lines = lyricsDisplay.querySelectorAll('.lyric-line');
  for (var i = 0; i < lines.length; i++) {
    var lineIdx = parseInt(lines[i].dataset.idx, 10);
    lines[i].classList.remove('active', 'passed', 'upcoming');
    if (lineIdx === idx) lines[i].classList.add('active');
    else if (lineIdx < idx) lines[i].classList.add('passed');
    else lines[i].classList.add('upcoming');
  }
}

function updateWordProgress(lineIdx, progress) {
  var lineEl = lyricsDisplay.querySelector('.lyric-line[data-idx="' + lineIdx + '"]');
  if (!lineEl) return;
  var wordSpans = lineEl.querySelectorAll('.word');
  if (!wordSpans.length) return;
  var activeWordIdx = Math.min(wordSpans.length - 1, Math.floor(progress * wordSpans.length));
  for (var i = 0; i < wordSpans.length; i++) {
    wordSpans[i].classList.remove('active');
    if (i === activeWordIdx) wordSpans[i].classList.add('active');
    if (i < activeWordIdx) wordSpans[i].classList.add('passed');
    else if (i > activeWordIdx) wordSpans[i].classList.remove('passed');
  }
}

function scrollToLine(idx) {
  var el = lyricsDisplay.querySelector('.lyric-line[data-idx="' + idx + '"]');
  if (!el) return;
  var container = lyricsDisplay;
  var target = el.offsetTop - container.clientHeight / 2 + el.offsetHeight / 2;
  container.scrollTo({ top: target, behavior: 'smooth' });
}


/* ==========================================
   ▶ AUDIO EVENTS
   ========================================== */
audioPlayer.addEventListener('play', function(){
  albumArt.classList.add('playing');
  if (lineTimings.length) startFollowLyrics();
});
audioPlayer.addEventListener('pause', function(){
  albumArt.classList.remove('playing');
  stopFollowLyrics();
});
audioPlayer.addEventListener('ended', function(){
  albumArt.classList.remove('playing');
  stopFollowLyrics();
});
audioPlayer.addEventListener('seeked', function(){
  if (!audioPlayer.paused && lineTimings.length) startFollowLyrics();
});


/* ==========================================
   ← BACK
   ========================================== */
function backToSearch() {
  stopFollowLyrics();
  audioPlayer.pause();
  audioPlayer.src = '';
  albumArt.classList.remove('playing');
  currentTrack = null;
  lineTimings = [];
  currentActiveLine = -1;

  playerView.style.display = 'none';
  resultsView.style.display = 'block';
  backBtn.style.display = 'none';
}
window.backToSearch = backToSearch;
